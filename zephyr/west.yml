# West manifest for the i.MX95 Cortex-M7 Zephyr workspace.
# Pulls Zephyr plus only the modules the M7 needs. Used by scripts/zephyr-setup.sh
# (workspace/manifest/west.yml is a symlink to this file).
manifest:
  version: "1.2"
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.5.0
      import:
        name-allowlist:
          - cmsis
          - cmsis_6
          - hal_nxp
          - libmetal
          - open-amp
  self:
    path: manifest
