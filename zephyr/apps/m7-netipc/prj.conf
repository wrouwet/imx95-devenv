# m7-netipc: Zephyr on the i.MX95 Cortex-M7, loaded by Linux (remoteproc)
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=65536

# --- IPC: OpenAMP RPMsg with a resource table (Linux is the host) ---
CONFIG_IPM=y
CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=16
CONFIG_OPENAMP_MASTER=n

# --- Shell on the M7 debug UART and over RPMsg (/dev/ttyRPMSG* on Linux) ---
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_RPMSG=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_PROMPT_RPMSG="m7:~$ "
CONFIG_SHELL_PROMPT_UART="m7-uart:~$ "
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y

# --- Logging ---
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y

# --- Networking over the ENETC0 VF (VSI) shared with Linux ---
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_ARP=y
CONFIG_NET_ICMPV4_ACCEPT_BROADCAST=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
# The app starts DHCPv4 itself after adopting the Linux-assigned VF MAC
# (src/net.c), so net_config must not start a second client at boot.
CONFIG_NET_CONFIG_SETTINGS=n
# Needed to change the MAC (NET_REQUEST_ETHERNET_SET_MAC_ADDRESS)
CONFIG_NET_L2_ETHERNET_MGMT=y
# 169.254.x.x link-local address when there is no DHCP server, e.g. a cable
# straight to a laptop
CONFIG_NET_IPV4_AUTO=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_SHELL=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_ETHERNET=y
CONFIG_NET_LOG=y
CONFIG_POSIX_API=y
CONFIG_ETH_DRIVER=y

# --- Random numbers ---
# The M7 has no entropy driver (the TRNG belongs to the ELE). The timer-based
# generator is fine for TCP ports/DHCP xids but NOT cryptographically secure.
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TIMER_RANDOM_GENERATOR=y

# --- L2 reflector (src/reflector.c) ---
# Process received frames in the NETC driver's RX thread instead of handing
# them to a separate RX traffic-class thread: one context switch less per
# frame. The whole stack (ARP, UDP, TCP, DHCP) then runs in that thread, so
# it needs a bigger stack than the driver's default 1500 bytes.
CONFIG_NET_TC_RX_COUNT=0
CONFIG_ETH_NXP_IMX_RX_THREAD_STACK_SIZE=4096
# Core cycle counter (DWT) for timing the reflector handler
CONFIG_TIMING_FUNCTIONS=y
