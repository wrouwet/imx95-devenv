# From samples/subsys/ipc/openamp_rsc_table/boards/imx95_evk_mimx9596_m7.conf
CONFIG_CLOCK_CONTROL=y
CONFIG_OPENAMP_WITH_DCACHE=y
CONFIG_ARM_SCMI=y
CONFIG_MBOX_INIT_PRIORITY=0
# Off: Linux copies its resource table to 0x88220000 before starting the M7 and
# the app uses it in place (see src/rpmsg.c). Copying would clobber the vrings.
CONFIG_OPENAMP_COPY_RSC_TABLE=n
