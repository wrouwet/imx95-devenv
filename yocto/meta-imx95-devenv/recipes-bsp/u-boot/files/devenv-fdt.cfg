CONFIG_DEFAULT_FDT_FILE="imx95-19x19-evk-devenv.dtb"
# USB2 belongs to the M7 (SM config mx95devenv): any A55 access faults.
# "bootflow scan" probes USB boot devices and crashed U-Boot that way, so the
# default boot goes straight to the BSP eMMC boot. (The NXP default is
# "run sr_ir_v2_cmd; bootflow scan -lb; run bsp_bootcmd".) Do not run
# "usb start" in U-Boot either.
CONFIG_BOOTCOMMAND="run sr_ir_v2_cmd; run bsp_bootcmd"
