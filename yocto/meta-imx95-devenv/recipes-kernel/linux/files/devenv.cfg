# imx95-devenv kernel options (merged into imx_v8_defconfig by kernel-yocto)
# remoteproc + RPMsg for the Cortex-M7
CONFIG_REMOTEPROC=y
CONFIG_IMX_REMOTEPROC=y
CONFIG_RPMSG=y
CONFIG_RPMSG_VIRTIO=y
CONFIG_RPMSG_CHAR=m
CONFIG_RPMSG_CTRL=m
CONFIG_RPMSG_TTY=m
# NETC: PF with SR-IOV; VF driver built but kept off the M7's VF (autoprobe=0)
CONFIG_PCI_IOV=y
CONFIG_FSL_ENETC_VF=m
