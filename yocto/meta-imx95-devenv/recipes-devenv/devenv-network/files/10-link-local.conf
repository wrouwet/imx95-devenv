# imx95-devenv: drop-in for systemd's 80-wired.network (DHCP on eth0/eth1).
# Also take an IPv4 link-local address (169.254.x.x), so the board is reachable
# on a cable straight to a laptop with no DHCP server (verified 2026-11-16).
# The M7 does the same (CONFIG_NET_IPV4_AUTO). On a normal LAN DHCP still works.
[Network]
LinkLocalAddressing=yes
# Try this address first so Linux is easy to find; it falls back to a random
# 169.254.x.x if the address is taken.
IPv4LLStartAddress=169.254.95.2
