# /etc/imx95-console/tmux.conf - board session (prefix Ctrl-b)
set -g default-terminal "tmux-256color"
set -g history-limit 50000
set -g mouse on
set -g base-index 0
set -g status-interval 2
set -g status-style "bg=colour24,fg=colour255"
set -g status-left "#[bold] i.MX95 #[default]"
set -g status-left-length 12
set -g status-right "M7: #(m7ctl state 2>/dev/null) | #H | %H:%M "
set -g status-right-length 60
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=colour31,bold] #I:#W "
set -g monitor-activity on
set -g pane-border-status top
set -g pane-border-format " #{pane_title} "
set -g pane-active-border-style "fg=colour45,bold"
set -g allow-rename off
set -g allow-set-title off
# Ctrl-b m -> M7 pane, Ctrl-b l -> Linux pane, Ctrl-b z -> zoom current pane
bind-key m select-window -t main \; select-pane -t main.0
bind-key l select-window -t main \; select-pane -t main.1
